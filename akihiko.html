<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script src="femc-mode.js?v=3"></script>
  <title>Akihiko — Social Link</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/femc/femc-pages.css?v=1">
  <style>
    .sl { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(24px, 5vw, 64px); align-items: center; max-width: 1180px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 48px) 64px; }
    .sl-arcana { display: inline-flex; align-items: baseline; gap: 10px; padding: 6px 16px; background: var(--night); transform: skewX(-14deg); box-shadow: 4px 4px 0 var(--pink); }
    .sl-arcana > * { transform: skewX(14deg); }
    .sl-arcana b { color: var(--pink); font-size: 22px; }
    .sl-arcana span { font: italic 800 13px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .2em; text-transform: uppercase; }
    .sl h1 { margin: 18px 0 6px; font-size: clamp(56px, 9vw, 116px); line-height: .84; letter-spacing: -.03em; transform: skewX(-8deg); text-shadow: .055em .055em 0 var(--pink); }
    .sl-meta { margin: 14px 0 26px; color: var(--muted); font-size: 15px; }
    .sl-rank { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
    .sl-rank-num { min-width: 3.4em; font-size: 44px; line-height: 1; transform: skewX(-8deg); }
    .sl-rank-num small { display: block; color: var(--pink-2); font-size: 13px; letter-spacing: .3em; }
    .sl-pips { display: flex; flex-wrap: wrap; gap: 7px; }
    .sl-pips i { width: 20px; height: 20px; border: 2px solid rgba(255, 140, 192, .5); transform: rotate(45deg) scale(.8); transition: background .3s, border-color .3s, transform .4s cubic-bezier(.2, 1.6, .4, 1); }
    .sl-pips i.on { background: var(--pink); border-color: #fff; transform: rotate(45deg) scale(1); }
    .sl-pips i.new { animation: sl-pip 1s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes sl-pip { 0% { transform: rotate(45deg) scale(2.2); background: #fff; } }
    .sl-box { position: relative; margin: 26px 0 24px; }
    .sl-box > span { display: inline-block; margin-left: 16px; padding: 5px 16px; background: var(--pink); font: italic 900 16px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .05em; text-transform: uppercase; transform: skewX(-14deg); box-shadow: 4px 4px 0 var(--night); }
    .sl-box p { min-height: 5em; margin: -4px 0 0; padding: 18px 22px; border: 2px solid var(--pink-2); border-radius: 4px 22px 4px 22px; background: rgba(20, 7, 15, .9); box-shadow: 6px 6px 0 rgba(255, 79, 158, .45); font-size: 17px; font-weight: 600; }
    .sl-note { margin: 16px 0 0; color: var(--muted); font-size: 14px; }
    .sl-photo { position: relative; margin: 0; transform: rotate(2deg); }
    .sl-photo img { display: block; width: 100%; border: 10px solid #fff; box-shadow: 14px 14px 0 var(--pink), 0 30px 60px #0009; transition: filter 1.4s ease; }
    .sl-photo.locked img { filter: blur(18px) grayscale(.6) brightness(.6); }
    .sl-photo figcaption { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; text-align: center; transition: opacity .6s; }
    .sl-photo figcaption b { font-size: clamp(30px, 4vw, 46px); transform: skewX(-8deg); text-shadow: 3px 3px 0 var(--pink); }
    .sl-photo:not(.locked) figcaption { opacity: 0; }
    .sl-up { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none; background: radial-gradient(circle, rgba(255, 79, 158, .5), transparent 60%); animation: sl-up 2.4s ease both; }
    .sl-up b { font-size: clamp(64px, 14vw, 180px); line-height: .85; text-align: center; transform: skewX(-10deg); text-shadow: .06em .06em 0 var(--pink), .12em .12em 0 var(--night); animation: sl-slam 2.4s cubic-bezier(.2, 1.4, .4, 1) both; }
    .sl-up small { display: block; font-size: .2em; letter-spacing: .3em; text-shadow: 2px 2px 0 var(--night); }
    @keyframes sl-up { 0% { opacity: 0; } 12%, 70% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes sl-slam { 0% { transform: skewX(-10deg) scale(1.8); opacity: 0; } 18% { transform: skewX(-10deg) scale(1); opacity: 1; } }
    @media (max-width: 820px) { .sl { grid-template-columns: 1fr; } .sl-photo { max-width: 460px; margin: 0 auto; } }
  </style>
</head>
<body>
  <header class="fp-top"><a class="fp-back" href="index.html">‹ Back</a><button class="fp-music" id="music" type="button" aria-pressed="true" hidden>♪ Tender Feeling</button></header>

  <section class="fp-locked" id="locked" hidden>
    <div>
      <p class="fp-kicker">Iwatodai Dorm · 2F</p>
      <h1 class="cond">No one's answering.</h1>
      <p>He only lives on the other side.</p>
    </div>
  </section>

  <main class="sl" id="open" hidden>
    <section>
      <span class="sl-arcana cond"><b>XVII</b><span>The Star</span></span>
      <h1 class="cond">Akihiko<br>Sanada</h1>
      <p class="sl-meta">Third year · Gekkoukan High · Boxing club captain</p>
      <div class="sl-rank"><span class="sl-rank-num cond"><small>RANK</small><span id="rank">1</span></span><span class="sl-pips" id="pips"></span></div>
      <div class="sl-box"><span>Akihiko</span><p id="line"></p></div>
      <button class="fp-btn" id="hang" type="button">Spend time together</button>
      <p class="sl-note" id="note"></p>
    </section>
    <figure class="sl-photo locked" id="photo">
      <img src="assets/femc/img/akihiko-hug.jpg" alt="Akihiko and FeMC hugging">
      <figcaption><b class="cond">Rank MAX</b><span>keep spending time together</span></figcaption>
    </figure>
  </main>

  <script src="achievements.js?v=5"></script>
  <script>
  (function () {
    // One line per rank. Rank 1 is the day you meet; each later rank takes a new real day.
    const LINES = [
      "You're the new transfer student, right? ...You look like you could keep up. Want to go for a run sometime?",
      "Protein's the key. You'd be surprised what a good bowl of beef can fix.",
      "Shinji used to say I never know when to stop. ...He wasn't wrong.",
      "I don't fight to win. I fight so I'm strong enough when it counts.",
      "Most people get tired of hearing me talk about training. You just... listen.",
      "I had a little sister. Miki. ...I couldn't do anything that day. I've been trying to be strong enough ever since.",
      "Funny. I used to come up to the roof to clear my head. Now I come up here hoping you'll show up.",
      "You don't have to be strong all the time, you know. ...I'm saying that to myself too.",
      "I'm not good with words, so I'll just say it. I want you around. Not as a teammate.",
      "I'm going to keep getting stronger. But this time, it's so I can stay next to you."
    ];
    const KEY = 'kg-femc-aki';
    const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { rank: 0 }; } catch (e) { return { rank: 0 }; } };
    const write = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} };
    const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const $ = id => document.getElementById(id);
    const F = () => window.FemcMode;
    const sfx = n => F()?.sfx(n);

    let typing = 0;
    function say(text) {
      const el = $('line'), token = ++typing;
      if (reduced) { el.textContent = text; return; }
      let i = 0;
      const step = () => {
        if (token !== typing) return;
        el.textContent = text.slice(0, ++i);
        if (i % 3 === 1) sfx('femc-text');
        if (i < text.length) setTimeout(step, text[i - 1] === '.' ? 130 : 28);
      };
      step();
    }
    function paint(newRank) {
      const s = read(), max = s.rank >= 10;
      $('rank').textContent = max ? 'MAX' : s.rank;
      $('pips').replaceChildren(...Array.from({ length: 10 }, (_, i) => { const p = document.createElement('i'); if (i < s.rank) p.className = 'on' + (newRank && i === s.rank - 1 ? ' new' : ''); return p; }));
      $('photo').classList.toggle('locked', !max);
      const done = s.day === today();
      $('hang').hidden = max;
      $('hang').disabled = done;
      $('note').textContent = max ? 'Your bond with him is as strong as it gets.' : done ? 'You already spent today together. See him tomorrow.' : '';
    }
    function rankUp(label) {
      sfx('femc-rankup');
      if (reduced) return;
      const up = document.createElement('div');
      up.className = 'sl-up';
      up.innerHTML = `<b class="cond">${label}</b>`;
      document.body.appendChild(up);
      setTimeout(() => up.remove(), 2500);
    }
    function hang() {
      const s = read();
      if (s.day === today() || s.rank >= 10) return;
      s.rank += 1; s.day = today(); write(s);
      paint(true);
      rankUp(s.rank >= 10 ? 'RANK<br>MAX' : `RANK ${s.rank}<small>your bond grew stronger</small>`);
      setTimeout(() => say(LINES[s.rank - 1]), reduced ? 0 : 1200);
      if (s.rank >= 10) window.Achievements?.unlock('max-rank');
    }
    $('hang').addEventListener('click', hang);

    // Tender Feeling, while you're with him.
    const song = new Audio('assets/femc/music/tender-feeling.mp3');
    song.loop = true;
    song.volume = 0.35;
    let wantSong = true;
    const playSong = () => { if (wantSong && F()?.isOn() && !document.querySelector('.femc-intro')) song.play().catch(() => {}); };
    $('music').addEventListener('click', () => { wantSong = !wantSong; $('music').setAttribute('aria-pressed', String(wantSong)); wantSong ? playSong() : song.pause(); });
    addEventListener('pointerdown', playSong, { once: true });

    let shown = null;
    function render() {
      const on = !!F()?.isOn();
      if (on === shown) return;
      shown = on;
      $('locked').hidden = on; $('open').hidden = !on; $('music').hidden = !on;
      if (!on) { song.pause(); return; }
      window.Achievements?.unlock('senpai');
      const s = read();
      if (!s.rank) { s.rank = 1; s.day = today(); write(s); paint(true); rankUp('RANK 1<small>social link established</small>'); setTimeout(() => say(LINES[0]), reduced ? 0 : 1200); }
      else { paint(false); say(LINES[Math.min(s.rank, 10) - 1]); }
      playSong();
    }
    new MutationObserver(() => { render(); playSong(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    new MutationObserver(playSong).observe(document.body, { childList: true });
    render();
  })();
  </script>
</body>
</html>
