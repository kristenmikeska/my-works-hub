<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script src="femc-mode.js?v=97"></script>
  <title>Social Links</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/femc/femc-pages.css?v=2">
  <style>
    .sl-wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) 80px; }
    .cal { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin: 4px 0 30px; }
    .cal-date { display: flex; align-items: baseline; gap: 12px; padding: 8px 20px; background: var(--night); transform: skewX(-14deg); box-shadow: 5px 5px 0 rgba(255, 79, 158, .5); }
    .cal-date > * { transform: skewX(14deg); }
    .cal-date b { font: italic 900 34px/1 "Avenir Next Condensed", "Arial Narrow", sans-serif; }
    .cal-date small { color: var(--pink-2); font: italic 800 14px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
    .cal-free { color: var(--muted); font-size: 14px; }
    .cal-free b { color: var(--ink); }
    .cal-btns { display: flex; gap: 8px; margin-left: auto; }
    .cal-btns button { padding: 8px 16px; border: 0; background: rgba(255, 255, 255, .1); color: var(--ink); font: italic 800 14px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; transform: skewX(-14deg); cursor: inherit; }
    .cal-btns em { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 99px; background: var(--pink); color: #fff; font-style: normal; transform: skewX(14deg); }
    .cal-btns button:is(:hover, :focus-visible) { background: #fff; color: var(--night); outline: none; box-shadow: 4px 4px 0 var(--pink); }
    .page-title { margin: 0 0 6px; font-size: clamp(52px, 9vw, 104px); line-height: .85; transform: skewX(-8deg); text-shadow: .055em .055em 0 var(--pink); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 18px; margin-top: 26px; }
    .card { position: relative; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px 16px; border: 1px solid rgba(255, 140, 192, .3); background: linear-gradient(160deg, rgba(255, 79, 158, .12), rgba(20, 7, 15, .85)); color: var(--ink); text-decoration: none; transition: transform .2s, box-shadow .2s, border-color .2s; }
    a.card:is(:hover, :focus-visible) { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--pink); border-color: #fff; outline: none; }
    .card.locked { opacity: .6; }
    .arc { display: grid; place-content: center; gap: 4px; width: 74px; height: 110px; border: 2px solid var(--pink-2); border-radius: 6px; background: linear-gradient(160deg, var(--pink), #7a0b3e); text-align: center; }
    .arc b { font: italic 900 26px/1 "Avenir Next Condensed", sans-serif; }
    .arc small { font: italic 800 10px/1.1 "Avenir Next Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .arc.art { background: center / cover no-repeat; border: 0; border-radius: 5px; box-shadow: 3px 3px 0 rgba(255, 79, 158, .45); }
    .arc.art > * { visibility: hidden; }
    .tarot-big { float: right; width: clamp(90px, 14vw, 150px); aspect-ratio: 360 / 507; margin: 6px 0 12px 18px; border-radius: 8px; background: center / cover no-repeat; box-shadow: 6px 6px 0 rgba(255, 79, 158, .45); transform: rotate(4deg); }
    .card.locked .arc { background: rgba(255, 255, 255, .06); border-style: dashed; }
    .card h2 { margin: 0; font: italic 900 26px/1 "Avenir Next Condensed", "Arial Narrow", sans-serif; }
    .card p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
    .pips { display: flex; gap: 4px; margin-top: 8px; }
    .pips i { width: 11px; height: 11px; border: 1.5px solid rgba(255, 140, 192, .55); transform: rotate(45deg) scale(.8); }
    .pips i.on { background: var(--pink); border-color: #fff; transform: rotate(45deg) scale(1); }
    .free-tag { position: absolute; top: -10px; right: 12px; padding: 4px 10px; background: #8ee3b0; color: var(--night); font: italic 900 12px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; transform: skewX(-14deg); }
    .detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: clamp(24px, 5vw, 64px); align-items: center; }
    .detail h1 { margin: 16px 0 6px; font-size: clamp(54px, 9vw, 112px); line-height: .84; transform: skewX(-8deg); text-shadow: .055em .055em 0 var(--pink); }
    .detail .meta { color: var(--muted); }
    .rankrow { display: flex; align-items: center; gap: 18px; margin: 22px 0; }
    .rankrow .num { font: italic 900 46px/1 "Avenir Next Condensed", sans-serif; transform: skewX(-8deg); }
    .rankrow .num small { display: block; color: var(--pink-2); font-size: 13px; letter-spacing: .3em; }
    .rankrow .pips i { width: 18px; height: 18px; }
    .meter { display: grid; gap: 8px; max-width: 460px; margin: -6px 0 22px; }
    .meter-bar { position: relative; height: 18px; border: 2px solid var(--pink-2); background: var(--night); transform: skewX(-18deg); overflow: hidden; box-shadow: 4px 4px 0 rgba(255, 79, 158, .4); }
    .meter-bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--pink), #ffb3d6); }
    .meter p { margin: 0; color: var(--muted); font: italic 800 14px/1.2 "Avenir Next Condensed", sans-serif; letter-spacing: .06em; }
    .meter p b { color: var(--pink-2); }
    .status { margin: 0 0 20px; padding: 14px 18px; border: 2px solid var(--pink-2); border-radius: 4px 20px 4px 20px; background: rgba(20, 7, 15, .9); box-shadow: 6px 6px 0 rgba(255, 79, 158, .4); }
    .status b { color: var(--pink-2); }
    .memories { margin-top: 26px; }
    .memories h2 { margin: 0 0 10px; font: italic 900 22px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .04em; }
    .memories div { display: flex; flex-wrap: wrap; gap: 8px; }
    .memories button { padding: 6px 12px; border: 1px solid rgba(255, 140, 192, .4); background: none; color: var(--ink); font: 600 13px/1 "Avenir Next", sans-serif; cursor: inherit; }
    .memories button:is(:hover, :focus-visible) { background: var(--pink); border-color: var(--pink); outline: none; }
    .big-portrait { width: 100%; max-height: 72vh; object-fit: contain; object-position: bottom; filter: drop-shadow(12px 12px 0 rgba(255, 79, 158, .4)); -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 98%); mask-image: linear-gradient(to bottom, #000 78%, transparent 98%); }
    .back-to-list { display: inline-block; margin-bottom: 8px; color: var(--pink-2); font: italic 800 14px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
    .sl-tabs { display: flex; gap: 10px; margin: 0 0 22px; }
    .sl-tabs a { padding: 8px 20px; background: rgba(255, 255, 255, .08); color: var(--ink); font: italic 900 16px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; transform: skewX(-14deg); }
    .sl-tabs a.on { background: var(--pink); box-shadow: 4px 4px 0 #fff; }
    .sl-tabs a:not(.on):is(:hover, :focus-visible) { background: #fff; color: var(--night); outline: none; }
    .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; margin-top: 22px; }
    .area { padding: 16px 18px 18px; border: 1px solid rgba(255, 140, 192, .3); background: linear-gradient(160deg, rgba(255, 79, 158, .1), rgba(20, 7, 15, .85)); }
    .area.pic { background: linear-gradient(180deg, rgba(20, 7, 15, .35), rgba(20, 7, 15, .9) 70%), var(--pic) center / cover no-repeat; }
    .area.pic.late { background: linear-gradient(180deg, rgba(16, 18, 52, .6), rgba(20, 7, 15, .92) 70%), var(--pic) center / cover no-repeat; }
    .area h2 { text-shadow: 3px 3px 0 rgba(20, 7, 15, .8); }
    .area.secret { border-color: #8fb0ff; background: radial-gradient(ellipse at 30% 0%, rgba(120, 160, 255, .28), transparent 70%), linear-gradient(160deg, #0b1236, #14070f); box-shadow: 0 0 24px rgba(120, 160, 255, .35); animation: secret-glow 2.4s ease-in-out infinite alternate; }
    .area.secret .who i { background: #2f5bd8; font-style: normal; }
    @keyframes secret-glow { to { box-shadow: 0 0 40px rgba(120, 160, 255, .6); } }
    @media (prefers-reduced-motion: reduce) { .area.secret { animation: none; } }
    .area.busy { border-color: var(--pink-2); box-shadow: 6px 6px 0 rgba(255, 79, 158, .45); }
    .area h2 { margin: 0 0 12px; font: italic 900 24px/1 "Avenir Next Condensed", "Arial Narrow", sans-serif; transform: skewX(-6deg); }
    .area .quiet, .area .usual { margin: 0; color: var(--muted); font-size: 13.5px; }
    .area .usual { margin-top: 10px; }
    .who { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; margin: 0 0 8px; padding: 8px 10px; border: 0; background: rgba(20, 7, 15, .9); color: var(--ink); text-align: left; transform: skewX(-8deg); box-shadow: 4px 4px 0 rgba(255, 79, 158, .5); cursor: inherit; }
    .who > * { transform: skewX(8deg); }
    .who i { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: var(--pink); font: italic 900 22px/1 "Avenir Next Condensed", sans-serif; font-style: normal; }
    .who i img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; transform: scale(1.6); transform-origin: 50% 12%; background: #3a1028; }
    .who b { display: block; font: italic 900 19px/1.1 "Avenir Next Condensed", sans-serif; }
    .who small { display: block; color: var(--pink-2); font-size: 12.5px; }
    .who:is(:hover, :focus-visible) { background: #fff; color: var(--night); outline: none; box-shadow: 6px 6px 0 var(--pink); }
    .who:is(:hover, :focus-visible) small { color: #7a0b3e; }
    .spent-note { margin: 0 0 6px; padding: 12px 16px; border-left: 4px solid var(--pink); background: rgba(20, 7, 15, .8); }
    @media (max-width: 820px) { .detail { grid-template-columns: 1fr; } .big-portrait { max-height: 50vh; } .cal-btns { margin-left: 0; } }
  </style>
</head>
<body>
  <header class="fp-top"><a class="fp-back" href="index.html">‹ Back</a></header>

  <section class="fp-locked" id="locked" hidden>
    <div>
      <p class="fp-kicker">Social Links</p>
      <h1 class="cond">Nobody here knows you yet.</h1>
      <p>These bonds only exist on the other side.</p>
    </div>
  </section>

  <main class="sl-wrap" id="open" hidden>
    <div class="cal" id="cal"></div>
    <div id="view"></div>
  </main>

  <script src="achievements.js?v=20"></script>
  <script src="femc-social.js?v=97"></script>
  <script>
  (function () {
    const $ = id => document.getElementById(id);
    const F = () => window.FemcMode;
    const X = window.FemcSocial;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const pips = n => Array.from({ length: 10 }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');

    function cal() {
      const n = X.now(), free = X.freeNow();
      $('cal').innerHTML = `<div class="cal-date"><b>${n.md}</b><small>${n.day} · ${n.time}</small></div>
        <p class="cal-free">${free.length ? `Free right now: <b>${free.map(l => esc(X.nameFor(l))).join(', ')}</b>` : 'Nobody you know is free right now.'}</p>
        <div class="cal-btns"><button type="button" id="phoneBtn">Phone${X.unread() ? ` <em>${X.unread()}</em>` : ''}</button><button type="button" id="wait">Wait ▸</button><button type="button" id="nextday">Next day ▸▸</button></div>`;
      $('phoneBtn').addEventListener('click', () => X.openPhone());
      $('wait').addEventListener('click', () => { X.advance(); F().sfx('femc-hover'); });
      $('nextday').addEventListener('click', () => { X.nextDay(); F().sfx('femc-hover'); });
    }

    const tabs = on => `<nav class="sl-tabs" aria-label="Social links views"><a href="#"${on === 'map' ? ' class="on" aria-current="page"' : ''}>Go out</a><a href="#links"${on === 'links' ? ' class="on" aria-current="page"' : ''}>Social links</a>${X.storySeen().length ? `<a href="#story"${on === 'story' ? ' class="on" aria-current="page"' : ''}>Story</a>` : ''}</nav>`;

    // Go out: pick a place for this time of day, and whoever is free there shows up.
    const AREAS = ['Gekkoukan High', 'Iwatodai Dorm', 'Iwatodai Station', 'Iwatodai Strip', 'Paulownia Mall', 'Port Island Station', 'Port Island', 'Naganaki Shrine', 'Tatsumi Memorial Hospital', 'Moonlight Bridge'];
    const areaOf = place => place.split(' · ')[0];
    function map() {
      const n = X.now();
      const known = Object.values(X.links).filter(l => !l.hidden && (X.isMet(l.id) || X.status(l).reason !== 'away'));
      const areas = [...new Set([...AREAS, ...known.map(l => areaOf(l.home.place))])].filter(a => known.some(l => areaOf(l.home.place) === a));
      const spent = !X.state().free && X.state().spent[`${n.d}-${n.slot}`] && !(X.state().story?.ended && n.last);
      $('view').innerHTML = `${tabs('map')}<p class="fp-kicker">Iwatodai · 2009</p><h1 class="page-title cond">Go out</h1>
        <p class="cal-free">Where do you want to spend this ${esc(n.time.toLowerCase())}? People keep their own schedules.</p>
        ${spent ? `<p class="spent-note">You've already spent this ${esc(n.time.toLowerCase())} with someone. <b>Wait ▸</b> to move on.</p>` : ''}
        <div class="map">${X.secretPlaces().map(pl => `<section class="area busy secret"><h2>${esc(pl.area)}</h2><p class="usual">${esc(pl.hint || "You don't remember this being here.")}</p>
            <button class="who" type="button" data-secret="${pl.id}"><i>✦</i><span><b>${esc(pl.title)}</b><small>Tonight only</small></span></button></section>`).join('')}${areas.map(a => {
          const here = known.filter(l => areaOf(l.home.place) === a);
          const free = here.filter(l => X.status(l).ok);
          const usual = here.filter(l => X.isMet(l.id) && !free.includes(l));
          const pic = X.areaBackground(a);
          return `<section class="area${free.length ? ' busy' : ''}${pic ? ` pic${n.slot === 1 ? ' late' : ''}` : ''}"${pic ? ` style="--pic:url('${pic}')"` : ''}><h2>${esc(a)}</h2>
            ${free.map(l => {
              const met = X.isMet(l.id), p = X.progress(l.id), pic = met ? X.portrait(l.id, 'neutral') : null;
              const spot = l.home.place.split(' · ').slice(1).join(' · ');
              return `<button class="who" type="button" data-go="${l.id}"><i>${pic ? `<img src="${pic}" alt="">` : (met ? esc(l.short[0]) : '?')}</i>
                <span><b>${met ? esc(l.short) : 'Someone new'}</b><small>${met ? `Rank ${p.rank}${p.ready === p.rank ? ' · hang out' : ''} · ` : ''}${esc(spot || a)}</small></span></button>`;
            }).join('') || '<p class="quiet">Nobody you know is around right now.</p>'}
            ${usual.length ? `<p class="usual">Usually here: ${usual.map(l => esc(l.short)).join(', ')}</p>` : ''}</section>`;
        }).join('')}</div>`;
      $('view').querySelectorAll('[data-secret]').forEach(b => b.addEventListener('click', () => X.visitPlace(b.dataset.secret, render)));
      $('view').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { const l = X.links[b.dataset.go]; X.play(l, X.progress(l.id).rank, { onDone: render }); }));
    }

    // The main story so far: every act Solar has reached, with the events she has seen, to replay.
    function storyPage() {
      const seen = X.storySeen();
      const acts = X.storyActs().filter(a => seen.some(e => e.act === a.id && !e.secret));
      $('view').innerHTML = `${tabs('story')}<p class="fp-kicker">Iwatodai · 2009</p><h1 class="page-title cond">Story</h1>
        <p class="cal-free">Everything that has happened so far, beyond your bonds.</p>
        ${acts.map(a => `<section class="memories"><h2>Act ${esc(a.numeral)} · ${esc(a.title)}</h2><div>${seen.filter(e => e.act === a.id && !e.secret).map(e => `<button type="button" data-ev="${e.id}">${esc(e.title)}</button>`).join('')}</div></section>`).join('')}
        ${seen.some(e => e.secret) ? `<section class="memories"><h2>Secrets</h2><div>${seen.filter(e => e.secret).map(e => `<button type="button" data-ev="${e.id}">${esc(e.title)}</button>`).join('')}</div></section>` : ''}
        ${X.state().story?.ended ? `<section class="memories ngp"><h2>New Game+${X.state().ngp ? ` <small>· cycle ${X.state().ngp + 1}</small>` : ''}</h2><p class="cal-free">Start the year again from April 7. Your bonds, the calendar and the story begin over; your passport stamps, codes and compendium stay, and bonds come a little easier this time.</p><div><button type="button" id="ngp">Begin again ▸</button></div></section>` : ''}`;
      $('view').querySelectorAll('[data-ev]').forEach(b => b.addEventListener('click', () => X.playEvent(X.storyEvents().find(e => e.id === b.dataset.ev), { replay: true })));
      $('ngp')?.addEventListener('click', () => {
        if (!confirm('Start New Game+? Your current links and calendar will start over from April 7. Stamps, codes and the compendium are kept.')) return;
        if (X.newGamePlus()) { location.hash = ''; render(); window.scrollTo(0, 0); }
      });
    }

    function list() {
      const all = Object.values(X.links).filter(l => !l.hidden);
      const shown = all.filter(l => X.isMet(l.id) || X.status(l).reason !== 'away');
      $('view').innerHTML = `${tabs('links')}<p class="fp-kicker">Iwatodai · 2009</p><h1 class="page-title cond">Social Links</h1>
        <p class="cal-free">Bonds you've made on the other side. Someone new may be waiting where you least expect.</p>
        <div class="grid">${shown.map(l => {
          const met = X.isMet(l.id), p = X.progress(l.id), st = X.status(l);
          const sub = met ? (p.rank >= 10 ? 'Rank MAX' : `Rank ${p.rank}`) : 'Not met yet';
          return `<a class="card${met ? '' : ' locked'}" href="#${l.id}">${st.ok ? '<span class="free-tag">Free now</span>' : ''}
            <span class="arc${met && X.tarot(l) ? ' art' : ''}"${met && X.tarot(l) ? ` style="background-image:url('${X.tarot(l)}')"` : ''}><b>${met ? l.numeral : '?'}</b><small>${met ? l.arcana : '???'}</small></span>
            <span><h2>${esc(X.nameFor(l))}</h2><p>${sub}</p><span class="pips">${met ? pips(p.rank) : ''}</span></span></a>`;
        }).join('')}</div>`;
    }

    function reasonText(l, st) {
      const p = X.progress(l.id);
      if (p.rank >= 10) return st.ok ? `<b>Your bond is as strong as it gets.</b> ${p.route === 'romance' && l.dates?.length ? `${esc(l.short)} is free for a date.` : `${esc(l.short)} is around if you want to hang out.`}` : 'Your bond is as strong as it gets.';
      if (st.ok) return `<b>${esc(X.nameFor(l))} is free right now.</b> ${p.rank ? (p.ready === p.rank ? 'You\'re close to something new. Hang out to fill the meter.' : '') : 'You haven\'t met yet.'}`;
      if (st.reason === 'closed') return `The ${esc(l.arcana)} has gone quiet. Some bonds only have so much time.`;
      if (st.reason === 'spent') return "You've already spent this time with someone. Wait for the next part of the day.";
      if (st.reason === 'later') return `Not yet. Something about the timing feels wrong. Try again after <b>${st.when}</b>.`;
      return `Busy right now. ${esc(l.home.hint || '')}`;
    }

    // The bond meter toward the next rank (♪ from hangouts and texts).
    function meter(l, p) {
      if (!X.isMet(l.id) || p.rank >= l.ranks.length) return '';
      const req = X.need(l, p.rank), have = Math.min(p.xp || 0, req);
      if (!req) return '';
      return `<div class="meter"><div class="meter-bar" role="progressbar" aria-label="Bond toward rank ${p.rank + 1}" aria-valuemin="0" aria-valuemax="${req}" aria-valuenow="${have}"><i style="width:${(have / req) * 100}%"></i></div>
        <p><b>${have} / ${req} ♪</b> toward ${p.rank + 1 >= l.ranks.length ? 'Rank MAX' : `Rank ${p.rank + 1}`}${p.ready === p.rank ? ' · almost there' : ''}</p></div>`;
    }

    function detail(l) {
      const p = X.progress(l.id), st = X.status(l), met = X.isMet(l.id);
      const face = p.rank >= 9 && p.route === 'romance' ? 'blushing' : p.rank ? 'happy' : 'neutral';
      // Full-body art when Kat has it, otherwise the scene portrait.
      const pic = met ? (X.profile(l.id) || X.portrait(l.id, face)) : null;
      $('view').innerHTML = `<a class="back-to-list" href="#links">‹ All social links</a>
        <div class="detail"><section>${met && X.tarot(l) ? `<span class="tarot-big" role="img" aria-label="${esc(l.arcana)} arcana" style="background-image:url('${X.tarot(l)}')"></span>` : ''}
          <span class="arc" style="width:auto;height:auto;padding:8px 18px;display:inline-grid;transform:skewX(-14deg)"><b style="transform:skewX(14deg)">${met ? `${l.numeral} · ${l.arcana}` : '???'}</b></span>
          <h1 class="cond">${esc(X.nameFor(l))}</h1>
          <p class="meta">${met ? esc(l.from) : 'Someone you haven\'t met.'}${p.route ? ` · ${p.route === 'romance' ? 'Romance' : 'Friendship'}` : ''}${met ? ` · ${p.notes} ♪` : ''}</p>
          <div class="rankrow"><span class="num cond"><small>RANK</small>${p.rank >= 10 ? 'MAX' : p.rank}</span><span class="pips">${pips(p.rank)}</span></div>
          ${meter(l, p)}
          <p class="status">${reasonText(l, st)}</p>
          ${st.ok ? `<button class="fp-btn" id="hang" type="button">${!p.rank ? 'Introduce yourself' : p.rank >= l.ranks.length ? (p.route === 'romance' && l.dates?.length ? 'Go on a date' : 'Hang out') : 'Spend time together'}</button>` : ''}
          ${p.seen.length ? `<div class="memories"><h2>Memories</h2><div>${p.seen.slice().sort((a, b) => a - b).map(r => `<button type="button" data-r="${r}">Rank ${r + 1} · ${esc(l.ranks[r].place)}</button>`).join('')}</div></div>` : ''}
        </section>
        <div>${pic ? `<img class="big-portrait" src="${pic}" alt="${esc(l.name)}">` : ''}</div></div>`;
      $('hang')?.addEventListener('click', () => X.play(l, p.rank, { onDone: render }));
      $('view').querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => X.play(l, +b.dataset.r, { replay: true })));
    }

    let shown = null;
    function render() {
      const on = !!F()?.isOn();
      $('locked').hidden = on; $('open').hidden = !on;
      if (!on) return;
      cal();
      const id = location.hash.slice(1);
      const l = X.links[id];
      if (l && !l.hidden && (X.isMet(id) || X.status(l).reason !== 'away')) detail(l); else if (id === 'links') list(); else if (id === 'story' && X.storySeen().length) storyPage(); else map();
      // The main story comes first; someone new waiting comes after.
      setTimeout(() => { if (!X.offerStory(render)) X.offerApproach(render); }, 500);
    }
    X.load().then(() => {
      render();
      if (F()?.isOn()) X.playIntro(render);
      X.onChange(render);
      addEventListener('hashchange', render);
      new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    });
  })();
  </script>
</body>
</html>
