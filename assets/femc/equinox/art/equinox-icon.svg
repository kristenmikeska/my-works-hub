       sun-moon (assets/femc/title/solstice-icon.svg). -->
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#e6d6c6"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b47"/><stop offset="1" stop-color="#a50d1b"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0304"/>
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#b3121f" stroke-width="2.5"/>
  <line x1="7" y1="44" x2="57" y2="21" stroke="#b3121f" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
