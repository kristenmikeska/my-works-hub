<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script src="femc-mode.js?v=28"></script>
  <title>Compendium</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/femc/femc-pages.css?v=1">
  <style>
    .cp { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) 64px; }
    .cp-head h1 { margin: 6px 0 4px; font-size: clamp(54px, 9vw, 110px); line-height: .85; transform: skewX(-8deg); text-shadow: .055em .055em 0 var(--pink); }
    .cp-head p { margin: 12px 0 28px; color: var(--muted); }
    .cp-grid { display: grid; grid-template-columns: minmax(240px, 380px) minmax(0, 1fr); gap: clamp(20px, 4vw, 48px); align-items: start; }
    .cp-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .cp-list button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 18px; border: 0; background: rgba(255, 255, 255, .06); color: var(--ink); text-align: left; transform: skewX(-12deg); cursor: inherit; }
    .cp-list button > * { transform: skewX(12deg); }
    .cp-list button small { color: var(--pink-2); font: italic 800 13px/1 "Avenir Next Condensed", sans-serif; letter-spacing: .08em; }
    .cp-list button b { font: italic 800 20px/1.1 "Avenir Next Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; }
    .cp-list button[aria-selected="true"], .cp-list button:is(:hover, :focus-visible) { background: #fff; color: var(--night); box-shadow: 6px 6px 0 var(--pink); outline: none; }
    .cp-list button[aria-selected="true"] small { color: var(--pink); }
    .cp-list button.locked b { opacity: .5; letter-spacing: .3em; }
    .cp-card { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); overflow: hidden; background: var(--night); border: 2px solid var(--pink-2); border-radius: 4px 28px 4px 28px; box-shadow: 10px 10px 0 rgba(255, 79, 158, .45); }
    .cp-card img { width: 100%; height: 100%; min-height: 340px; object-fit: cover; }
    .cp-card.has-profile img { object-fit: contain; object-position: center bottom; padding-top: 14px; background: radial-gradient(ellipse at 50% 85%, rgba(255, 79, 158, .35), transparent 65%), linear-gradient(160deg, #3a1028, #14070f); filter: drop-shadow(8px 8px 0 rgba(255, 79, 158, .35)); }
    .cp-card.locked.has-profile img { filter: brightness(0) drop-shadow(0 0 0 #ff4f9e); opacity: .5; }
    .cp-sil { min-height: 340px; background: radial-gradient(circle at 50% 34%, #000 0 17%, transparent 17.5%), radial-gradient(ellipse at 50% 100%, #000 0 42%, transparent 42.5%), linear-gradient(160deg, #3a1028, #14070f); opacity: .9; }
    .cp-list { max-height: 70vh; overflow-y: auto; padding: 4px 14px 10px 4px; }
    .cp-card.locked img { filter: brightness(0) drop-shadow(0 0 0 #ff4f9e); opacity: .5; }
    .cp-info { padding: 26px 26px 30px; }
    .cp-info h2 { margin: 8px 0 4px; font-size: clamp(34px, 4vw, 52px); line-height: .9; transform: skewX(-8deg); }
    .cp-info .from { color: var(--pink-2); font-size: 14px; }
    .cp-info p.note { margin: 18px 0 22px; font-size: 16px; }
    .cp-count { margin-top: 16px; color: var(--muted); font-size: 13px; }
    @media (max-width: 820px) { .cp-grid, .cp-card { grid-template-columns: 1fr; } .cp-card img { min-height: 0; max-height: 360px; } }
  </style>
</head>
<body>
  <header class="fp-top"><a class="fp-back" href="index.html">‹ Back</a></header>

  <section class="fp-locked" id="locked" hidden>
    <div>
      <p class="fp-kicker">Compendium</p>
      <h1 class="cond">The pages are blank.</h1>
      <p>This book only opens on the other side.</p>
    </div>
  </section>

  <main class="cp" id="open" hidden>
    <header class="cp-head"><p class="fp-kicker">Kat's favorites from the other side</p><h1 class="cond">Compendium</h1><p>Characters from the worlds I didn't write. Entries fill in as you find things on the other side.</p></header>
    <div class="cp-grid">
      <div><ul class="cp-list" id="list" role="listbox" aria-label="Characters"></ul><p class="cp-count" id="count"></p></div>
      <article class="cp-card" id="card" aria-live="polite"></article>
    </div>
  </main>

  <script src="achievements.js?v=9"></script>
  <script>
  (function () {
    // FEMC data files carry FemcMode.v (FEMC_ASSET_VERSION in femc-mode.js), like every FEMC image below.
    const F = () => window.FemcMode, v = F().v;
    Promise.all([F().load(`assets/femc/compendium.js?v=${v}`, () => window.FEMC_COMPENDIUM), F().load(`assets/femc/portraits/index.js?v=${v}`, () => window.FEMC_PORTRAITS),
      F().load(`assets/femc/profile/index.js?v=${v}`, () => window.FEMC_PROFILE)]).then(start);

    function start() {
      const ENTRIES = (window.FEMC_COMPENDIUM || []).filter(e => !e.secret || window.femcCompendiumOpen(e));
      // Anyone with a neutral portrait in assets/femc/portraits gets it here automatically.
      // Hand-set portrait paths get the current image version so regenerated portraits show up.
      ENTRIES.forEach(e => { if (e.img && e.img.startsWith('assets/femc/portraits/') && !e.img.includes('?')) e.img += `?v=${v}`; });
      // Full-body art (assets/femc/profile) wins over everything else.
      ENTRIES.forEach(e => { if ((window.FEMC_PROFILE || []).includes(e.id)) { e.img = `assets/femc/profile/${e.id}.webp?v=${v}`; e.profile = true; } });
      ENTRIES.forEach(e => { if (!e.img && (window.FEMC_PORTRAITS?.[e.id] || []).includes('neutral')) e.img = `assets/femc/portraits/${e.id}/neutral.webp?v=${v}`; });
      const $ = id => document.getElementById(id);
      const isOpen = e => window.femcCompendiumOpen(e);
      const hintFor = e => e.unlock.startsWith('met:') ? 'someone you haven\'t met yet.' : e.unlock.startsWith('reg:') ? 'they turn up in someone else\'s story.' : (window.Achievements?.list().find(a => a.id === e.unlock) || {}).hint || 'keep exploring the other side.';
      let current = 0;

      function show(i) {
        current = i;
        const e = ENTRIES[i], open = isOpen(e), card = $('card');
        [...$('list').children].forEach((li, j) => li.firstChild.setAttribute('aria-selected', String(j === i)));
        card.className = `cp-card${open ? '' : ' locked'}${e.profile ? ' has-profile' : ''}`;
        card.innerHTML = `${e.img ? '<img alt="">' : '<div class="cp-sil" aria-hidden="true"></div>'}<div class="cp-info"><p class="fp-kicker"></p><h2 class="cond"></h2><p class="from"></p><p class="note"></p></div>`;
        if (e.img) { card.querySelector('img').src = e.img; card.querySelector('img').alt = open ? e.name : ''; }
        card.querySelector('.fp-kicker').textContent = `No. ${String(i + 1).padStart(3, '0')}${open && e.arcana ? ` · ${e.arcana}` : ''}`;
        card.querySelector('h2').textContent = open ? e.name : '???';
        card.querySelector('.from').textContent = open ? e.from : 'Not yet registered';
        card.querySelector('.note').textContent = open ? e.note : `Hint: ${hintFor(e)}`;
        if (open && e.link) {
          const a = document.createElement('a');
          a.className = 'fp-btn'; a.href = e.link; a.textContent = 'Social Link';
          card.querySelector('.cp-info').appendChild(a);
        }
      }
      function list() {
        $('list').replaceChildren(...ENTRIES.map((e, i) => {
          const li = document.createElement('li');
          const b = document.createElement('button');
          b.type = 'button'; b.setAttribute('role', 'option');
          b.className = isOpen(e) ? '' : 'locked';
          b.innerHTML = `<small>${String(i + 1).padStart(3, '0')}</small><b></b>`;
          b.querySelector('b').textContent = isOpen(e) ? e.name : '???';
          b.addEventListener('click', () => show(i));
          li.appendChild(b);
          return li;
        }));
        $('count').textContent = `${ENTRIES.filter(isOpen).length} of ${ENTRIES.length} registered`;
        show(current);
      }

      let shown = null;
      function render() {
        const on = !!F()?.isOn();
        if (on === shown) return;
        shown = on;
        $('locked').hidden = on; $('open').hidden = !on;
        if (!on) return;
        window.Achievements?.unlock('compendium');
        list();
      }
      new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      render();
    }
  })();
  </script>
</body>
</html>
