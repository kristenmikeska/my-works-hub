<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- Story fights run this page inside femc-game.html (?embed=1): it borrows the game's FEMC mode (sounds, no second badge
       or background music). On its own it's the practice mode, with FEMC mode as usual. -->
  <script>try { if (/[?&]embed=1\b/.test(location.search) && window.parent !== window && window.parent.FemcMode) window.FemcMode = window.parent.FemcMode; } catch (e) {}</script>
  <script src="femc-mode.js?v=104"></script>
  <title>Tartarus Practice · Persona 3: Solstice</title>
  <link rel="icon" href="assets/femc/title/solstice-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/femc/battle/battle.css?v=57">
  <link rel="stylesheet" href="assets/femc/battle/tartarus.css?v=7">
  <link rel="stylesheet" href="assets/femc/battle/solstice-battle.css?v=7">
  <!-- Inside a Persona 3: Equinox game (the parent page sets FEMC_GAME_CONFIG.id 'equinox'): the battle stylesheets become their
       blood-red copies (tools/equinox-css.py) and equinox/battle.css turns the Dark Hour red. Solstice and practice: untouched. -->
  <script>try { if (window.parent !== window && (window.parent.FEMC_GAME_CONFIG || {}).id === 'equinox') {
    document.querySelectorAll('link[rel=stylesheet][href^="assets/femc/battle/"]').forEach(l => { l.href = l.getAttribute('href').replace(/^assets\/femc\/battle\/([a-z-]+\.css)\?v=\d+/, 'assets/femc/equinox/css/battle-$1?v=1'); });
    document.write('<link rel="stylesheet" href="assets/femc/equinox/battle.css?v=1">'); document.documentElement.dataset.game = 'equinox';
  } } catch (e) {}</script>
</head>

  <noscript><p style="padding:24px">The battle needs JavaScript.</p></noscript>
