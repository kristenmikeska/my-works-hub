<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Camera Roll — solarkim</title>
  <script src="femc-mode.js?v=89"></script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --accent: #9d73ff; --ink: #f6f2ff; --muted: #a49cb8; --bg: #0b0a10; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse at 50% -10%, #2a1d4a 0%, transparent 55%), var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", ui-sans-serif, system-ui, sans-serif; }
    .roll { width: min(760px, 100%); margin: 0 auto; padding: 18px 0 60px; }
    .roll-top { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 0; }
    .roll-back { color: var(--accent); font-size: 15px; text-decoration: none; }
    .roll-select { color: var(--accent); font-size: 15px; opacity: .7; }
    .roll-head { padding: 8px 16px 12px; }
    .roll-head h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -.02em; }
    .roll-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .albums { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); scrollbar-width: none; }
    .albums::-webkit-scrollbar { display: none; }
    .albums button { flex-shrink: 0; padding: 7px 14px; border: 0; border-radius: 99px; background: #ffffff12; color: var(--ink); font: 600 13px/1 inherit; font-family: inherit; cursor: pointer; }
    .albums button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .albums button small { margin-left: 5px; opacity: .6; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 0 2px; }
    .grid button { position: relative; aspect-ratio: 1; padding: 0; border: 0; background: #1a1724; cursor: pointer; overflow: hidden; }
    .grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s, opacity .4s; opacity: 0; }
    .grid img.loaded { opacity: 1; }
    .grid button:hover img { transform: scale(1.04); }
    .grid button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
    .grid .fav-dot { position: absolute; right: 5px; bottom: 4px; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000a; }
    .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
    .viewer { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #000; color: #fff; overflow: hidden; }
    .viewer::backdrop { background: #000; }
    .viewer-bar { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: max(14px, env(safe-area-inset-top)) 16px 14px; background: linear-gradient(#000c, transparent); }
    .viewer-bar b { text-align: center; font-size: 15px; }
    .viewer-bar small { display: block; color: #ffffffa0; font-weight: 400; font-size: 12px; }
    .viewer-bar button, .viewer-tools button { border: 0; background: none; color: var(--accent); font: 600 15px inherit; font-family: inherit; cursor: pointer; }
    .viewer-bar .close { justify-self: start; }
    .viewer-stage { position: absolute; inset: 0; display: grid; place-items: center; touch-action: pan-y; }
    .viewer-stage img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform .25s ease, opacity .2s; }
    .viewer-nav { position: absolute; top: 50%; z-index: 2; width: 46px; height: 46px; margin-top: -23px; border: 0; border-radius: 50%; background: #ffffff1c; color: #fff; font-size: 22px; cursor: pointer; }
    .viewer-nav.prev { left: 14px; } .viewer-nav.next { right: 14px; }
    .viewer-tools { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; justify-content: center; padding: 18px 16px max(22px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, #000c); }
    .viewer-tools .heart { font-size: 26px; color: #fff; transition: transform .3s cubic-bezier(.3, 1.8, .5, 1); }
    .viewer-tools .heart[aria-pressed="true"] { color: #ff4f8b; transform: scale(1.15); }
    @media (max-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } .viewer-nav { display: none; } }
    @media (prefers-reduced-motion: reduce) { .grid img, .viewer-stage img { transition: none; } }
  </style>
</head>
<body>
  <main class="roll">
    <div class="roll-top"><a class="roll-back" href="world.html#hoax">‹ Hoax</a><span class="roll-select" aria-hidden="true">Select</span></div>
    <div class="roll-head"><h1 id="albumTitle">Recents</h1><p id="albumMeta">solarkim · camera roll</p></div>
    <nav class="albums" id="albums" aria-label="Albums"></nav>
    <div class="grid" id="grid"></div>
  </main>

  <dialog class="viewer" id="viewer" aria-label="Photo viewer">
    <div class="viewer-bar"><button class="close" type="button">Close</button><b id="viewerTitle"></b><span></span></div>
    <div class="viewer-stage" id="stage"><img id="photo" alt=""></div>
    <button class="viewer-nav prev" type="button" aria-label="Previous photo">‹</button>
    <button class="viewer-nav next" type="button" aria-label="Next photo">›</button>
    <div class="viewer-tools"><button class="heart" type="button" aria-pressed="false" aria-label="Favorite">♡</button></div>
  </dialog>

  <script src="assets/hoax/roll.js?v=1"></script>
  <script src="achievements.js?v=18"></script>
  <script>
  (function () {
    const ALBUMS = window.HOAX_ROLL || [];
    const FAV_KEY = 'kg-hoax-favorites';
    const readFavs = () => { try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY)) || []); } catch (e) { return new Set(); } };
    let favs = readFavs();
    const saveFavs = () => { try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch (e) {} };
    // Recents mixes every album in a fixed shuffled order, like a real camera roll.
    const all = ALBUMS.flatMap(a => a.photos.map(p => ({ ...p, album: a.name })));
    let seed = 7; const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const recents = all.map(p => [rand(), p]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    const views = [{ id: 'recents', name: 'Recents', photos: recents }, ...ALBUMS.map(a => ({ ...a, photos: a.photos.map(p => ({ ...p, album: a.name })) }))];
    const albumsEl = document.getElementById('albums'), grid = document.getElementById('grid');
    const title = document.getElementById('albumTitle'), meta = document.getElementById('albumMeta');
    let current = views[0], index = 0;

    function viewList() {
      const list = [...views];
      if (favs.size) list.splice(1, 0, { id: 'favorites', name: 'Favorites ♥', photos: all.filter(p => favs.has(p.f)) });
      return list;
    }
    function renderAlbums() {
      albumsEl.replaceChildren(...viewList().map(v => {
        const b = document.createElement('button'); b.type = 'button';
        b.setAttribute('aria-pressed', String(v.id === current.id));
        b.textContent = v.name; const n = document.createElement('small'); n.textContent = v.photos.length; b.appendChild(n);
        b.addEventListener('click', () => { current = v; show(); if (v.id === 'nana') window.Achievements?.unlock('good-boy'); });
        return b;
      }));
    }
    function show() {
      if (current.id === 'favorites') current = { ...current, photos: all.filter(p => favs.has(p.f)) };
      title.textContent = current.name;
      meta.textContent = `solarkim · ${current.photos.length} ${current.photos.length === 1 ? 'photo' : 'photos'}`;
      renderAlbums();
      if (!current.photos.length) { grid.replaceChildren(Object.assign(document.createElement('p'), { className: 'empty', textContent: 'No photos yet.' })); return; }
      grid.replaceChildren(...current.photos.map((p, i) => {
        const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `${p.album}, photo ${i + 1}`);
        const img = document.createElement('img'); img.loading = 'lazy'; img.alt = ''; img.src = `assets/hoax/thumbs/${p.f}`;
        img.addEventListener('load', () => img.classList.add('loaded'));
        b.appendChild(img);
        if (favs.has(p.f)) b.appendChild(Object.assign(document.createElement('span'), { className: 'fav-dot', textContent: '♥' }));
        b.addEventListener('click', () => open(i));
        return b;
      }));
    }

    const viewer = document.getElementById('viewer'), photo = document.getElementById('photo'), vTitle = document.getElementById('viewerTitle'), heart = viewer.querySelector('.heart');
    function paint() {
      const p = current.photos[index];
      photo.style.opacity = 0;
      photo.onload = () => { photo.style.opacity = 1; };
      photo.src = `assets/hoax/roll/${p.f}`;
      vTitle.innerHTML = ''; vTitle.append(p.album); const s = document.createElement('small'); s.textContent = `${index + 1} of ${current.photos.length}`; vTitle.appendChild(s);
      const on = favs.has(p.f); heart.textContent = on ? '♥' : '♡'; heart.setAttribute('aria-pressed', String(on));
      heart.setAttribute('aria-label', on ? 'Remove from favorites' : 'Favorite');
      [current.photos[index + 1], current.photos[index - 1]].forEach(n => { if (n) new Image().src = `assets/hoax/roll/${n.f}`; });
    }
    function open(i) { index = i; paint(); viewer.showModal(); }
    const step = d => { index = (index + d + current.photos.length) % current.photos.length; paint(); };
    viewer.querySelector('.close').addEventListener('click', () => viewer.close());
    viewer.querySelector('.prev').addEventListener('click', () => step(-1));
    viewer.querySelector('.next').addEventListener('click', () => step(1));
    viewer.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
    viewer.addEventListener('close', () => show());
    heart.addEventListener('click', () => {
      const f = current.photos[index].f;
      favs.has(f) ? favs.delete(f) : favs.add(f); saveFavs(); paint();
    });
    let startX = null;
    const stage = document.getElementById('stage');
    stage.addEventListener('pointerdown', e => { startX = e.clientX; });
    stage.addEventListener('pointerup', e => { if (startX === null) return; const dx = e.clientX - startX; startX = null; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); });

    if (location.hash === '#nana') { current = views.find(v => v.id === 'nana') || current; window.Achievements?.unlock('good-boy'); }
    show();
    setTimeout(() => window.Achievements?.unlock('camera-roll'), 900);
  })();
  </script>
</body>
</html>
